name: 使用问题
description: 报告安装、上传或问答中遇到的问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请先查看安装指南与常见问题。不要提交 API 密钥、私人文档或漏洞利用细节。"
  - type: textarea
    id: reproduce
    attributes:
      label: 操作步骤与实际结果
      description: 请说明如何重现，以及期望发生什么。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 版本、操作系统、浏览器，以及使用源码还是 Docker 启动。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已去除敏感内容的日志
      render: text
